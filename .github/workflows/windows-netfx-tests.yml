name: Windows .NET Framework CI

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/optimize-routing-with-faster-lookup-bb89
      - feat/**
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore (MSBuild)
        shell: pwsh
        run: |
          & "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/MSBuild/Current/Bin/MSBuild.exe" Runtime.NetFramework.slnf /t:Restore /m /p:Configuration=Release /verbosity:minimal

      - name: Build (MSBuild)
        shell: pwsh
        run: |
          & "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/MSBuild/Current/Bin/MSBuild.exe" Runtime.NetFramework.slnf /t:Build /m /p:Configuration=Release /p:RunCodeAnalysis=false /verbosity:minimal

      - name: Find .NET Framework test assemblies
        id: find_tests
        shell: pwsh
        run: |
          $roots = @("test")
          $patterns = @(
            "bin/Release/net462/*.Test.dll",
            "bin/Release/*.Test.dll"
          )
          $paths = @()
          foreach ($root in $roots) {
            foreach ($pat in $patterns) {
              $paths += Get-ChildItem -Recurse -Path (Join-Path $root $pat) -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            }
          }
          $paths = $paths | Where-Object { $_ -notmatch "(netcoreapp|ns[0-9_]+|/obj/)" } | Select-Object -Unique
          if (-not $paths -or $paths.Count -eq 0) { Write-Host "No .NET Framework tests found" }
          $joined = $paths -join "\n"
          "paths=$joined" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run tests (.NET Framework)
        if: steps.find_tests.outputs.paths != ''
        shell: pwsh
        run: |
          $paths = @("${{ steps.find_tests.outputs.paths }}" -split "\n")
          $vstest = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/Common7/IDE/Extensions/TestPlatform/vstest.console.exe"
          foreach ($asm in $paths) {
            Write-Host "Running tests in $asm"
            & $vstest $asm /Platform:x64 /InIsolation /logger:trx || exit $LASTEXITCODE
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: |
            **/*.trx
            TestResults/**