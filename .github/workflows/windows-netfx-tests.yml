name: Windows .NET Framework CI

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/optimize-routing-with-faster-lookup-bb89
      - feat/**
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages (msbuild)
        shell: pwsh
        run: |
          nuget restore Runtime.sln

      - name: Build (msbuild)
        shell: pwsh
        run: |
          & "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/MSBuild/Current/Bin/MSBuild.exe" Runtime.sln /m /p:Configuration=Release /p:RunCodeAnalysis=false /verbosity:minimal

      - name: Find test assemblies
        id: find_tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Recurse -Include *.Test.dll -Path test | Where-Object { $_.FullName -notmatch "obj\\|bin\\.*\\(Debug|netcoreapp|ns)" }
          $paths = $tests | ForEach-Object { $_.FullName }
          if (-not $paths) { Write-Host "No tests found" }
          $joined = $paths -join "\n"
          "paths=$joined" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run tests (.NET Framework)
        if: steps.find_tests.outputs.paths != ''
        shell: pwsh
        run: |
          $paths = @("${{ steps.find_tests.outputs.paths }}" -split "\n")
          $vstest = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/Common7/IDE/Extensions/TestPlatform/vstest.console.exe"
          foreach ($asm in $paths) {
            Write-Host "Running tests in $asm"
            & $vstest $asm /Platform:x64 /InIsolation /logger:trx || exit $LASTEXITCODE
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: |
            **/*.trx
            TestResults/**